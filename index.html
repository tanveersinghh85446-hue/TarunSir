<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ANITIO | IT & Skill Development Institute</title>
    <meta
      name="description"
      content="ANITIO Information Technology & Skill Development Institute. Career oriented short and long term courses. Registered by Ministry of Corporate Affairs & MSME. ISO 9001:2015 certified."
    />
    <meta name="theme-color" content="#0a1f44" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link preview (WhatsApp, Facebook, etc.) -->
    <!-- %SITE_URL% is filled from VITE_SITE_URL at build time (see .env.example) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ANITIO" />
    <meta property="og:title" content="ANITIO | IT & Skill Development Institute" />
    <meta
      property="og:description"
      content="Career oriented short and long term courses. Registered by Ministry of Corporate Affairs & MSME. ISO 9001:2015 certified."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
